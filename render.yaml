services:
  - type: web
    name: greenpulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_API_URL
        sync: false
  - type: web
    name: greenpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: greenpulse-api
          envVarKey: RENDER_EXTERNAL_URL
